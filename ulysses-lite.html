<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ulysses Lite — 单文件 Markdown 长文写作器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{ box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; color: #1d1d1f; background: #fbfaf7;
    -webkit-font-smoothing: antialiased;
  }
  #app{ display: flex; height: 100vh; overflow: hidden; }

  /* ---------- 侧栏 ---------- */
  #sidebar{
    width: 268px; flex: 0 0 268px; background: #f2f0ea; border-right: 1px solid #e2ddd2;
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head{ display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px; }
  .logo{ font-weight: 600; letter-spacing: .02em; color: #4a4438; }
  .spacer{ flex: 1; }
  .icon-btn{
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid #dcd6c9; background: #fff;
    color: #4a4438; font-size: 16px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover{ background: #faf8f3; }
  #search{
    margin: 2px 14px 10px; padding: 6px 10px; border-radius: 7px; border: 1px solid #e2ddd2;
    background: #fff; font-size: 12.5px; outline: none; color: #333;
  }
  #search:focus{ border-color: #b9b09a; }
  #sheet-list{ flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .sheet-item{
    position: relative; padding: 9px 28px 9px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
  }
  .sheet-item:hover{ background: #eae6dd; }
  .sheet-item.active{ background: #fff; border-color: #ddd6c6; box-shadow: 0 1px 2px rgba(60,50,30,.06); }
  .sheet-title{ font-size: 13px; font-weight: 500; color: #262320; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-meta{ font-size: 11px; color: #948d7d; margin-top: 2px; }
  .sheet-item .del{
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: #b3ab99; cursor: pointer; font-size: 13px;
    padding: 4px 6px; border-radius: 6px; display: none;
  }
  .sheet-item:hover .del{ display: block; }
  .sheet-item.armed .del{ background: #8c2f2f; color: #fff; display: block; }
  .side-empty{ color: #9a9384; font-size: 12px; padding: 14px 12px; }
  .side-foot{ border-top: 1px solid #e2ddd2; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  #total-words{ font-size: 11.5px; color: #8a8375; }
  .mini-btn{
    border: 1px solid #dcd6c9; background: #fff; color: #4a4438; border-radius: 7px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; text-align: left;
  }
  .mini-btn:hover{ background: #faf8f3; }

  /* ---------- 主区 ---------- */
  #main{ flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fffefb; }
  header{
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid #eee9de; background: #fffefb;
  }
  #title{
    border: 0; outline: none; background: transparent; font-size: 15px; font-weight: 600;
    color: #1d1d1f; min-width: 80px; width: 320px; max-width: 40vw; padding: 4px 2px;
  }
  #title::placeholder{ color: #c3bcae; font-weight: 500; }
  .tool{
    border: 1px solid #e2ddd2; background: #fff; color: #57503f; border-radius: 7px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .tool:hover{ background: #faf8f3; }
  .tool.on{ background: #33302a; border-color: #33302a; color: #f7f4ec; }
  #goal-wrap{ display: flex; align-items: center; gap: 8px; }
  #bar{ width: 84px; height: 4px; border-radius: 3px; background: #ece7db; overflow: hidden; }
  #bar-fill{ height: 100%; width: 0%; background: #6b7f5e; transition: width .18s ease; }
  #goal-label{ font-size: 11.5px; color: #8a8375; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #goal{
    width: 68px; padding: 4px 6px; border: 1px solid #e6e1d5; border-radius: 6px;
    font-size: 11.5px; color: #57503f; background: #fff; outline: none;
  }

  #workspace{ position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .page{ max-width: 860px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 0 24px; }

  #editor, #mirror{
    font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, "Times New Roman", serif;
    font-size: 17px; line-height: 1.95; letter-spacing: .01em;
    padding: 28px 40px 40vh;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 2;
  }
  #editor{
    flex: 1; width: 100%; border: 0; outline: none; resize: none; background: transparent;
    color: #23211d; overflow-y: auto;
  }
  #editor::placeholder{ color: #c9c2b2; }
  #mirror{ position: absolute; left: -99999px; top: 0; visibility: hidden; height: auto; }

  /* ---------- 预览 ---------- */
  #preview{ display: none; flex: 1; overflow-y: auto; padding-bottom: 40vh; }
  body.preview-mode #preview{ display: block; }
  body.preview-mode #editor{ display: none; }
  .prose{
    font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
    font-size: 17px; line-height: 1.95; color: #23211d; padding-top: 28px;
  }
  .prose > *:first-child{ margin-top: 0; }
  .prose h1{ font-size: 27px; line-height: 1.4; margin: 1.4em 0 .6em; font-weight: 600; letter-spacing: -.01em; }
  .prose h2{ font-size: 21px; line-height: 1.45; margin: 1.5em 0 .55em; font-weight: 600; }
  .prose h3{ font-size: 18px; margin: 1.4em 0 .5em; font-weight: 600; }
  .prose h4, .prose h5, .prose h6{ font-size: 16px; margin: 1.2em 0 .4em; font-weight: 600; }
  .prose p{ margin: 0 0 1.05em; }
  .prose ul, .prose ol{ margin: 0 0 1.05em; padding-left: 1.5em; }
  .prose li{ margin: .3em 0; }
  .prose blockquote{
    margin: 1.2em 0; padding: .1em 0 .1em 1em; border-left: 2px solid #d8d0bd; color: #5c5546;
  }
  .prose blockquote p{ margin: .5em 0; }
  .prose hr{ border: 0; border-top: 1px solid #e5dfd1; margin: 2em 0; }
  .prose code{
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em;
    background: #f3efe5; padding: .12em .35em; border-radius: 4px;
  }
  .prose pre{ background: #f6f2e8; border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 1.1em; }
  .prose pre code{ background: transparent; padding: 0; font-size: 13px; line-height: 1.6; }
  .prose a{ color: #3f5f86; text-decoration: none; border-bottom: 1px solid #c9d4e3; }
  .prose strong{ font-weight: 650; }

  footer{
    display: flex; align-items: center; gap: 14px; padding: 6px 18px;
    border-top: 1px solid #f0ece2; font-size: 11.5px; color: #948d7d; background: #fffefb;
  }
  footer .grow{ flex: 1; }
  #stat-saved.saving{ color: #a89a6d; }

  @media (max-width: 820px){
    #sidebar{ width: 190px; flex-basis: 190px; }
    #title{ width: 160px; }
    #goal-wrap, #goal{ display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <span class="logo">文稿</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-new" title="新建文稿 (⌘N)">+</button>
    </div>
    <input id="search" type="search" placeholder="搜索标题或内容…">
    <div id="sheet-list"></div>
    <div class="side-foot">
      <div id="total-words">总字数 0</div>
      <button class="mini-btn" id="btn-export-all">导出全部 .md</button>
      <button class="mini-btn" id="btn-import">导入 .md 文件</button>
    </div>
  </aside>

  <main id="main">
    <header>
      <input id="title" placeholder="无标题" maxlength="120">
      <span class="spacer"></span>
      <div id="goal-wrap">
        <div id="bar"><div id="bar-fill"></div></div>
        <span id="goal-label">0 / 1000</span>
        <input id="goal" type="number" min="0" step="100" title="本篇目标字数">
      </div>
      <button class="tool" id="btn-typewriter" title="打字机模式">打字机</button>
      <button class="tool" id="btn-preview" title="切换预览 (⌘E)">预览</button>
      <button class="tool" id="btn-export" title="导出当前文稿 (⌘S)">导出</button>
    </header>

    <section id="workspace">
      <div class="page">
        <textarea id="editor" spellcheck="false" placeholder="从这里开始写…" autofocus></textarea>
        <div id="preview" class="prose"></div>
      </div>
      <div id="mirror" aria-hidden="true"></div>
    </section>

    <footer>
      <span id="stat-words">0 字</span>
      <span id="stat-saved">已保存到本浏览器</span>
      <span class="grow"></span>
      <span id="stat-hint">⌘N 新建 · ⌘E 预览 · ⌘S 导出 · Tab 缩进</span>
    </footer>
  </main>
</div>

<input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

<script type="text/markdown" id="welcome">
# 欢迎使用 Ulysses Lite

这是一个**单文件**的本地 Markdown 写作器，不联网、不上传。做成了 App 用时，数据自动存在你电脑的文稿库（~/Library/Application Support/UlyssesLite）；直接用浏览器打开时，存在当前浏览器的 localStorage 里。

## 先试这三件事

- 左边可以建很多「文稿」，一篇一个，像 Ulysses 的 sheet，不用管文件路径
- 点右上角 **预览**，看 Markdown 渲染出来的样子
- 打开 **打字机**，写作时光标固定在屏幕中间

## 只学六个语法，够写小说

1. `# ` 标题，`## ` 二级标题
2. `**加粗**`、`*斜体*`
3. `- ` 无序列表，`1. ` 有序列表
4. `> ` 引用，适合放独白、信件、引文
5. `---` 分割线，用来切场景
6. `[文字](链接)` 超链接

## 一段示例场景

> 那年夏天，我坐在阳台上，看楼下的梧桐叶一片一片往下掉。
> 母亲在屋里喊我吃饭，声音隔着纱窗，听起来像从很远的地方传来。

## 重要：一定记得备份

App 模式下每次改动都会实时写入文稿库文件，换浏览器、清缓存都不会丢；但任何磁盘都可能出事。定期点右上角 **导出** 或左边 **导出全部 .md**——App 会写进 ~/Documents/UlyssesLite/，浏览器会走下载。把文件放进网盘或者 Git 仓库最稳妥。这一条比上面所有功能都重要。
</script>

<script>
(function () {
  'use strict';

  var KEY = 'ulysses-lite-v1';
  var $ = function (s) { return document.querySelector(s); };

  var editor = $('#editor');
  var preview = $('#preview');
  var mirror = $('#mirror');
  var titleInput = $('#title');
  var searchInput = $('#search');
  var listEl = $('#sheet-list');
  var goalInput = $('#goal');
  var barFill = $('#bar-fill');
  var goalLabel = $('#goal-label');
  var statWords = $('#stat-words');
  var statSaved = $('#stat-saved');
  var totalWords = $('#total-words');
  var fileInput = $('#file-input');

  var db = null;
  var saveTimer = 0;
  var API = null; // 启动时探测：有本地服务则为 '/api'，否则 null（用 localStorage）

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  }

  function seed() {
    return {
      sheets: [{ id: uid(), title: '开始使用', content: ($('#welcome').textContent || '').trim(), created: Date.now() }],
      activeId: null,
      settings: { typewriter: true, preview: false, goal: 1000 }
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.sheets) || !d.sheets.length) return null;
      d.sheets.forEach(function (s) {
        if (typeof s.id !== 'string') s.id = uid();
        if (typeof s.title !== 'string') s.title = '未命名';
        if (typeof s.content !== 'string') s.content = '';
      });
      var st = d.settings || {};
      d.settings = {
        typewriter: st.typewriter !== false,
        preview: !!st.preview,
        goal: typeof st.goal === 'number' && st.goal >= 0 ? st.goal : 1000
      };
      return d;
    } catch (e) {
      return null;
    }
  }

  function persist() {
    clearTimeout(saveTimer);
    statSaved.classList.add('saving');
    statSaved.textContent = '保存中…';
    saveTimer = setTimeout(doSave, 220);
  }

  function doSave() {
    var payload = JSON.stringify(db);
    if (API) {
      fetch(API + '/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      }).then(function (r) {
        if (!r.ok) throw new Error('bad status');
        try { localStorage.setItem(KEY, payload); } catch (e) {} // 双保险
        statSaved.classList.remove('saving');
        statSaved.textContent = '已自动存入文稿库';
      }).catch(function () {
        statSaved.classList.remove('saving');
        statSaved.textContent = '保存失败，请立即导出';
      });
    } else {
      try {
        localStorage.setItem(KEY, payload);
        statSaved.classList.remove('saving');
        statSaved.textContent = '已保存到本浏览器';
      } catch (e) {
        statSaved.classList.remove('saving');
        statSaved.textContent = '保存失败，请立即导出';
      }
    }
  }

  function active() {
    for (var i = 0; i < db.sheets.length; i++) {
      if (db.sheets[i].id === db.activeId) return db.sheets[i];
    }
    return db.sheets[0];
  }

  /* ---------------- 字数 ---------------- */

  var CJK = /[\u2e80-\u9fff\uf900-\ufaff\u3040-\u30ff\uac00-\ud7af]/g;

  function countWords(text) {
    if (!text) return 0;
    var plain = text.replace(/```[\s\S]*?```/g, ' ');
    var cjk = (plain.match(CJK) || []).length;
    var latin = (plain.replace(CJK, ' ').match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
    return cjk + latin;
  }

  function updateTotal() {
    var total = 0;
    db.sheets.forEach(function (s) { total += countWords(s.content); });
    totalWords.textContent = '总字数 ' + total.toLocaleString();
  }

  function renderStats() {
    var a = active();
    var n = countWords(a.content);
    statWords.textContent = n.toLocaleString() + ' 字';
    var goal = db.settings.goal || 0;
    var pct = goal > 0 ? Math.min(100, Math.round((n / goal) * 100)) : 0;
    barFill.style.width = pct + '%';
    goalLabel.textContent = n.toLocaleString() + ' / ' + goal.toLocaleString();
    updateTotal();
  }

  /* ---------------- 侧栏 ---------------- */

  function renderSidebar() {
    var q = searchInput.value.trim().toLowerCase();
    listEl.innerHTML = '';
    var shown = 0;
    db.sheets.forEach(function (s) {
      if (q && (s.title + ' ' + s.content).toLowerCase().indexOf(q) === -1) return;
      shown++;
      var row = document.createElement('div');
      row.className = 'sheet-item' + (s.id === db.activeId ? ' active' : '');
      row.dataset.id = s.id;

      var t = document.createElement('div');
      t.className = 'sheet-title';
      t.textContent = s.title || '未命名';

      var m = document.createElement('div');
      m.className = 'sheet-meta';
      m.textContent = countWords(s.content).toLocaleString() + ' 字';

      var b = document.createElement('button');
      b.className = 'del';
      b.type = 'button';
      b.textContent = '×';
      b.title = '删除（再点一次确认）';
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        armDelete(row, s.id);
      });

      row.appendChild(t);
      row.appendChild(m);
      row.appendChild(b);
      row.addEventListener('click', function () { selectSheet(s.id); });
      listEl.appendChild(row);
    });
    if (!shown) {
      var empty = document.createElement('div');
      empty.className = 'side-empty';
      empty.textContent = q ? '没有匹配的文稿' : '还没有文稿，点 + 新建';
      listEl.appendChild(empty);
    }
  }

  function armDelete(row, id) {
    if (row.dataset.armed === '1') { deleteSheet(id); return; }
    row.dataset.armed = '1';
    row.classList.add('armed');
    var b = row.querySelector('.del');
    if (b) b.textContent = '确认';
    setTimeout(function () {
      if (!row.isConnected) return;
      row.dataset.armed = '0';
      row.classList.remove('armed');
      var bb = row.querySelector('.del');
      if (bb) bb.textContent = '×';
    }, 2600);
  }

  function deleteSheet(id) {
    db.sheets = db.sheets.filter(function (s) { return s.id !== id; });
    if (!db.sheets.length) {
      db.sheets.push({ id: uid(), title: '未命名', content: '', created: Date.now() });
    }
    if (!db.sheets.some(function (s) { return s.id === db.activeId; })) {
      db.activeId = db.sheets[0].id;
    }
    selectSheet(db.activeId);
    persist();
  }

  /* ---------------- 文稿切换 ---------------- */

  function selectSheet(id) {
    db.activeId = id;
    var a = active();
    titleInput.value = a.title;
    editor.value = a.content;
    editor.selectionStart = 0;
    editor.selectionEnd = 0;
    editor.scrollTop = 0;
    renderSidebar();
    renderStats();
    if (db.settings.preview) renderPreview();
    persist();
  }

  function newSheet() {
    var s = { id: uid(), title: '未命名', content: '', created: Date.now() };
    db.sheets.unshift(s);
    selectSheet(s.id);
    titleInput.focus();
    titleInput.select();
  }

  /* ---------------- 打字机 & 光标 ---------------- */

  function centerCaret() {
    if (!db.settings.typewriter) return;
    var ta = editor;
    var pos = ta.selectionStart;
    var cs = getComputedStyle(ta);
    var lh = parseFloat(cs.lineHeight);
    if (!lh || isNaN(lh)) lh = parseFloat(cs.fontSize) * 1.95;

    mirror.style.width = ta.clientWidth + 'px';
    mirror.textContent = ta.value.slice(0, pos);
    var marker = document.createElement('span');
    marker.textContent = '\u200b';
    mirror.appendChild(marker);

    var y = marker.offsetTop;
    var target = y - ta.clientHeight / 2 + lh / 2;
    if (target < 0) target = 0;
    if (Math.abs(target - ta.scrollTop) > 0.5) ta.scrollTop = target;
  }

  /* ---------------- Markdown ---------------- */

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(s) {
    var codes = [];
    var t = esc(s);
    t = t.replace(/`([^`]+)`/g, function (_, code) {
      codes.push(code);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>');
    t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\u0000(\d+)\u0000/g, function (_, n) { return '<code>' + codes[+n] + '</code>'; });
    return t;
  }

  function renderMarkdown(md) {
    var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    var list = null;
    var i = 0;

    function flushList() {
      if (!list) return;
      out.push('<' + list.type + '>' + list.items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</' + list.type + '>');
      list = null;
    }

    while (i < lines.length) {
      var line = lines[i];

      if (/^```/.test(line)) {
        var buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        flushList();
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      if (/^\s*$/.test(line)) { flushList(); i++; continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flushList();
        var lv = h[1].length;
        out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>');
        i++;
        continue;
      }

      if (/^\s*(?:---+|\*\*\*+|___+)\s*$/.test(line)) {
        flushList();
        out.push('<hr>');
        i++;
        continue;
      }

      if (/^\s*>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        flushList();
        out.push('<blockquote>' + qbuf.map(function (b) { return '<p>' + inline(b) + '</p>'; }).join('') + '</blockquote>');
        continue;
      }

      var ul = line.match(/^\s*[-*+]\s+(.*)$/);
      var ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ul || ol) {
        var type = ul ? 'ul' : 'ol';
        var text = ul ? ul[1] : ol[1];
        if (list && list.type !== type) flushList();
        if (!list) list = { type: type, items: [] };
        list.items.push(inline(text));
        i++;
        continue;
      }

      var pbuf = [line];
      i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^```/.test(lines[i]) &&
             !/^#{1,6}\s+/.test(lines[i]) && !/^\s*[-*+]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) && !/^\s*>/.test(lines[i])) {
        pbuf.push(lines[i]);
        i++;
      }
      flushList();
      out.push('<p>' + inline(pbuf.join('\n')).replace(/\n/g, '<br>') + '</p>');
    }
    flushList();
    return out.join('\n');
  }

  function renderPreview() {
    preview.innerHTML = renderMarkdown(active().content);
  }

  /* ---------------- 设置 ---------------- */

  function applySettings() {
    document.body.classList.toggle('preview-mode', db.settings.preview);
    $('#btn-preview').classList.toggle('on', db.settings.preview);
    $('#btn-typewriter').classList.toggle('on', !!db.settings.typewriter);
    goalInput.value = db.settings.goal;
    if (db.settings.preview) renderPreview();
  }

  /* ---------------- 编辑区事件 ---------------- */

  function syncFromEditor() {
    var a = active();
    a.content = editor.value;
    persist();
    renderStats();
    if (db.settings.preview) renderPreview();
    var meta = document.querySelector('.sheet-item[data-id="' + a.id + '"] .sheet-meta');
    if (meta) meta.textContent = countWords(a.content).toLocaleString() + ' 字';
  }

  editor.addEventListener('input', function () {
    syncFromEditor();
    centerCaret();
  });

  editor.addEventListener('click', function () { centerCaret(); });
  editor.addEventListener('keyup', function (e) {
    if (e.key.indexOf('Arrow') === 0 || e.key === 'Home' || e.key === 'End' || e.key === 'PageUp' || e.key === 'PageDown') {
      centerCaret();
    }
  });

  editor.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Tab' && !mod) {
      e.preventDefault();
      var s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
      syncFromEditor();
      return;
    }
    if (mod && !e.shiftKey && (e.key === 'b' || e.key === 'i')) {
      e.preventDefault();
      wrapSelection(e.key === 'b' ? '**' : '*');
    }
  });

  function wrapSelection(marker) {
    var s = editor.selectionStart, en = editor.selectionEnd;
    var sel = editor.value.slice(s, en);
    var ins = marker + sel + marker;
    editor.value = editor.value.slice(0, s) + ins + editor.value.slice(en);
    if (sel) {
      editor.selectionStart = s + marker.length;
      editor.selectionEnd = s + marker.length + sel.length;
    } else {
      editor.selectionStart = editor.selectionEnd = s + marker.length;
    }
    syncFromEditor();
  }

  titleInput.addEventListener('input', function () {
    var a = active();
    a.title = titleInput.value;
    persist();
    var el = document.querySelector('.sheet-item[data-id="' + a.id + '"] .sheet-title');
    if (el) el.textContent = a.title || '未命名';
  });
  titleInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); editor.focus(); }
  });

  searchInput.addEventListener('input', renderSidebar);

  goalInput.addEventListener('input', function () {
    var v = parseInt(goalInput.value, 10);
    db.settings.goal = isNaN(v) || v < 0 ? 0 : v;
    renderStats();
    persist();
  });

  $('#btn-new').addEventListener('click', newSheet);

  $('#btn-preview').addEventListener('click', function () {
    db.settings.preview = !db.settings.preview;
    applySettings();
    persist();
  });

  $('#btn-typewriter').addEventListener('click', function () {
    db.settings.typewriter = !db.settings.typewriter;
    applySettings();
    persist();
    if (db.settings.typewriter) centerCaret();
  });

  /* ---------------- 导入导出 ---------------- */

  function download(name, text) {
    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }

  function safeName(s) {
    var n = (s || '未命名').replace(/[\\/:*?"<>|]+/g, '_').trim().slice(0, 60);
    return n || '未命名';
  }

  function apiExport(name, text) {
    fetch(API + '/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: name, text: text })
    }).then(function (r) {
      if (!r.ok) throw new Error('bad status');
      return r.json();
    }).then(function (j) {
      var p = (j && j.path) ? String(j.path).replace(/^\/Users\/[^/]+/, '~') : '';
      statSaved.classList.remove('saving');
      statSaved.textContent = p ? '已导出：' + p : '已导出';
    }).catch(function () {
      download(name, text);
    });
  }

  function exportActive() {
    var a = active();
    var name = safeName(a.title) + '.md';
    var text = '# ' + (a.title || '未命名') + '\n\n' + a.content + '\n';
    if (API) apiExport(name, text); else download(name, text);
  }

  function exportAll() {
    var parts = db.sheets.map(function (s) {
      return '# ' + (s.title || '未命名') + '\n\n' + s.content;
    });
    var name = '全部文稿-' + new Date().toISOString().slice(0, 10) + '.md';
    var text = parts.join('\n\n---\n\n') + '\n';
    if (API) apiExport(name, text); else download(name, text);
  }

  $('#btn-export').addEventListener('click', exportActive);
  $('#btn-export-all').addEventListener('click', exportAll);
  $('#btn-import').addEventListener('click', function () { fileInput.click(); });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '');
      var base = f.name.replace(/\.[^.]+$/, '');
      var title = base || '导入的文稿';
      var body = text;
      var m = text.match(/^#\s+(.+)\n+/);
      if (m) { title = m[1].trim(); body = text.slice(m[0].length); }
      var s = { id: uid(), title: title, content: body, created: Date.now() };
      db.sheets.unshift(s);
      selectSheet(s.id);
    };
    reader.readAsText(f, 'utf-8');
    fileInput.value = '';
  });

  /* ---------------- 快捷键 ---------------- */

  document.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey;
    if (!mod) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'n') { e.preventDefault(); newSheet(); }
    else if (k === 'e') { e.preventDefault(); db.settings.preview = !db.settings.preview; applySettings(); persist(); }
    else if (k === 's') { e.preventDefault(); exportActive(); }
  });

  function flushNow() {
    clearTimeout(saveTimer);
    var payload = JSON.stringify(db);
    if (API) {
      try { fetch(API + '/state', { method: 'POST', body: payload, keepalive: true }); } catch (e) {}
    } else {
      try { localStorage.setItem(KEY, payload); } catch (e) {}
    }
  }

  window.addEventListener('beforeunload', flushNow);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushNow();
  });

  /* ---------------- 启动 ---------------- */

  function finishBoot(d) {
    var valid = d && Array.isArray(d.sheets) && d.sheets.length &&
      d.sheets.every(function (s) {
        return s && typeof s.id === 'string' && typeof s.title === 'string' && typeof s.content === 'string';
      });
    db = valid ? d : (load() || seed());
    if (!db.activeId || !db.sheets.some(function (s) { return s.id === db.activeId; })) {
      db.activeId = db.sheets[0].id;
    }
    if (!db.settings || typeof db.settings !== 'object') db.settings = {};
    db.settings.typewriter = db.settings.typewriter !== false;
    db.settings.preview = !!db.settings.preview;
    db.settings.goal = typeof db.settings.goal === 'number' && db.settings.goal >= 0 ? db.settings.goal : 1000;
    statSaved.textContent = API ? '已自动存入文稿库' : '已保存到本浏览器';
    selectSheet(db.activeId);
    applySettings();
    if (db.settings.typewriter) centerCaret();
  }

  // 探测本地文稿库服务（打包成 App 后存在；直接开 HTML 时自动退回 localStorage）
  fetch('/api/state').then(function (r) {
    if (!r.ok) throw new Error('no api');
    return r.json();
  }).then(function (d) {
    API = '/api';
    finishBoot(d);
  }).catch(function () {
    API = null;
    finishBoot(null);
  });
})();
</script>
</body>
</html>
